<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 offset-3">
                <div class="card">
                    <h3 class="bg-primary text-white text-center m-0">Post Form</h3>
                    <div class="card-body">
                        <form action="" id="postForm">
                            <div class="form-group">
                                <label for="title">Title</label>
                                <input type="text" class="form-control" id="title">
                        
                                <label for="content">content</label>
                                <textarea rows="3" class="form-control" id="content"></textarea>

                                <label for="userId">UserId</label>
                                <select class="form-control" id="userId">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>

                            <div>
                                <button type="submit" class="btn btn-primary btn-sm btn-block" id="addBtn">Add Post</button>
                                <button type="button" class="btn btn-primary btn-sm btn-block d-none" id="updateBtn">Update  Post</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

        <div class="row" id="postContainer">
